[package]
name = "apogee-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
apogee-common = { workspace = true }
nalgebra = { workspace = true }
hifitime = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
regex = "1.10"
urlencoding = "2.1"
# HWM14 FFI: only needed when the `hwm14` feature compiles the vendored
# Fortran model (build.rs links libgfortran + libquadmath statically).

[build-dependencies]
# No build-dependencies; build.rs invokes gfortran/ar directly.

[features]
default = []
hwm14 = []

[[example]]
name = "hwm14_samples"
required-features = ["hwm14"]

[dev-dependencies]
approx = "0.5"
ntest = { workspace = true }