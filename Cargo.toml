[workspace]
resolver = "2"
members = [
    "crates/apogee-core",
    "crates/apogee-net",
    "crates/apogee-server",
    "crates/apogee-godot",
    "crates/apogee-common",
    "crates/apogee-social",
    "crates/apogee-strategic",
    "crates/apogee-tactical",
    "crates/apogee-discovery",
    "crates/apogee-llm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Apogee Contributors"]

[workspace.dependencies]
# Numerics
nalgebra = "0.33"
num-traits = "0.2"
typenum = "1.17"
# Time
hifitime = "4.3"
# Errors
thiserror = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Parallelism
rayon = "1.10"
# Internal crates
apogee-common = { path = "crates/apogee-common" }
apogee-core = { path = "crates/apogee-core" }
apogee-net = { path = "crates/apogee-net" }
apogee-social = { path = "crates/apogee-social" }
apogee-strategic = { path = "crates/apogee-strategic" }
apogee-tactical = { path = "crates/apogee-tactical" }
apogee-discovery = { path = "crates/apogee-discovery" }
apogee-llm = { path = "crates/apogee-llm" }
# EOP cache directory
# dirs = "5.0"
