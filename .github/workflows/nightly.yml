name: Nightly

on:
  schedule:
    # Run every day at 06:00 UTC.
    - cron: '0 6 * * *'
  # Allow manual triggering for debugging.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Fast tests: everything except the heavy kernel/golden tests.
  full-test-fast:
    name: Fast test suite including ignored tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Fortran compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch external data assets
        run: ./scripts/fetch_data.sh

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (default workspace)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy with hwm14 feature
        run: cargo clippy -p apogee-core --features hwm14 -- -D warnings

      - name: Test workspace (including ignored tests, excluding slow kernel tests)
        run: cargo test --workspace -- --include-ignored --skip de441_mars_barycenter_vs_horizons --skip de441_multi_body_vs_horizons

      - name: Test hwm14 feature (including ignored Fortran tests)
        run: cargo test -p apogee-core --features hwm14 -- --include-ignored

      - name: Build hwm14_samples example
        run: cargo build --example hwm14_samples -p apogee-core --features hwm14

  # Slow kernel tests run separately with a generous timeout so they do
  # not cancel the fast job if they hang.
  slow-kernel-tests:
    name: Slow DE441 kernel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-nightly-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch external data assets
        run: ./scripts/fetch_data.sh

      - name: Test DE441 ephemeris validation
        run: cargo test --workspace -- --ignored de441_mars_barycenter_vs_horizons de441_multi_body_vs_horizons
