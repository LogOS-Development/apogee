name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  coverage-check:
    name: Code Coverage Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed to commit the badge update back to main.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Extract coverage percentage
        id: cov
        run: |
          # Parse lcov.info: DA:line,hit_count → covered = lines with hit>0
          STATS=$(grep "^DA:" lcov.info | awk -F, '{total++; if ($2>0) hit++} END {printf "%d %d", total, hit}')
          TOTAL_FOUND=$(echo $STATS | awk '{print $1}')
          TOTAL_HIT=$(echo $STATS | awk '{print $2}')
          if [ "$TOTAL_FOUND" -gt 0 ]; then
            PCT=$(echo "scale=1; $TOTAL_HIT * 100 / $TOTAL_FOUND" | bc)
          else
            PCT="0.0"
          fi
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: $PCT% ($TOTAL_HIT/$TOTAL_FOUND lines)"
          echo "coverage=$PCT" >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage threshold (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          PCT="${{ steps.cov.outputs.percentage }}"
          THRESHOLD="80.0"
          if (( $(echo "$PCT < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage $PCT% is below the $THRESHOLD% threshold"
            exit 1
          fi
          echo "::notice::Coverage $PCT% meets the $THRESHOLD% threshold"

      - name: Update README badge (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PCT="${{ steps.cov.outputs.percentage }}"
          # Color: red <60, orange <80, yellow <90, green >=90
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$PCT >= 80" | bc -l) )); then
            COLOR="yellow"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            COLOR="orange"
          else
            COLOR="red"
          fi
          # shields.io static badge: URL-encode the % as %25
          BADGE_URL="https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}"
          # Replace only the badge image URL (first parenthesized group on the
          # Coverage badge line), leaving the link target intact.
          sed -i -E "s|^\[!\[Coverage\]\([^)]*\)|[![Coverage](${BADGE_URL})|" README.md
          echo "Updated badge URL to: ${BADGE_URL}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No badge changes to commit"
          else
            git commit -m "chore: update coverage badge to ${PCT}% [skip ci]"
            if git push; then
              echo "Badge pushed to main"
            else
              echo "::warning::Could not push badge to main (branch protection?). Badge committed locally only."
            fi
          fi

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 7

  build-server:
    name: Build Server Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build server (release)
        run: cargo build --release -p apogee-server

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: apogee-server-linux
          path: target/release/apogee-server
          retention-days: 7
