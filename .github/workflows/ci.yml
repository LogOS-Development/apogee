name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  coverage-check:
    name: Code Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Print coverage percentage
        run: |
          STATS=$(grep "^DA:" lcov.info | awk -F, '{total++; if ($2>0) hit++} END {printf "%d %d", total, hit}')
          TOTAL_FOUND=$(echo $STATS | awk '{print $1}')
          TOTAL_HIT=$(echo $STATS | awk '{print $2}')
          if [ "$TOTAL_FOUND" -gt 0 ]; then
            PCT=$(echo "scale=1; $TOTAL_HIT * 100 / $TOTAL_FOUND" | bc)
          else
            PCT="0.0"
          fi
          echo "coverage=$PCT" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: $PCT% ($TOTAL_HIT/$TOTAL_FOUND lines)"

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 7

  coverage:
    name: Code Coverage
    # Coverage badge generation should only happen on main, not on every
    # feature branch push/PR, to avoid noisy badge commits and double uploads.
    if: github.ref == 'refs/heads/main'
    needs: coverage-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Extract coverage percentage
        id: cov
        run: |
          # Parse lcov.info: DA:line,hit_count → covered = lines with hit>0
          STATS=$(grep "^DA:" lcov.info | awk -F, '{total++; if ($2>0) hit++} END {printf "%d %d", total, hit}')
          TOTAL_FOUND=$(echo $STATS | awk '{print $1}')
          TOTAL_HIT=$(echo $STATS | awk '{print $2}')
          if [ "$TOTAL_FOUND" -gt 0 ]; then
            PCT=$(echo "scale=1; $TOTAL_HIT * 100 / $TOTAL_FOUND" | bc)
          else
            PCT="0.0"
          fi
          echo "percentage=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: $PCT% ($TOTAL_HIT/$TOTAL_FOUND lines)"

      - name: Generate coverage badge and JSON
        run: |
          PCT="${{ steps.cov.outputs.percentage }}"
          # Color: red <60, orange <80, yellow <90, green >=90
          if (( $(echo "$PCT >= 90" | bc -l) )); then
            COLOR="4c1"
          elif (( $(echo "$PCT >= 80" | bc -l) )); then
            COLOR="dfb317"
          elif (( $(echo "$PCT >= 60" | bc -l) )); then
            COLOR="fe7d37"
          else
            COLOR="e05d44"
          fi
          LABEL="coverage"
          # Calculate width based on text length
          VALUE="${PCT}%"
          LABEL_W=70
          VALUE_W=$(( ${#VALUE} * 8 + 10 ))
          TOTAL_W=$(( LABEL_W + VALUE_W ))
          cat > .github/badge-coverage.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="$TOTAL_W" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="$TOTAL_W" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h$LABEL_W v20H0z"/>
              <path fill="#$COLOR" d="M$LABEL_W 0h$VALUE_W v20H$LABEL_W z"/>
              <path fill="url(#b)" d="M0 0h$TOTAL_W v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
              <text x="$(( LABEL_W / 2 ))" y="14" fill="#010101" fill-opacity=".3">$LABEL</text>
              <text x="$(( LABEL_W / 2 ))" y="13">$LABEL</text>
              <text x="$(( LABEL_W + VALUE_W / 2 ))" y="14" fill="#010101" fill-opacity=".3">$VALUE</text>
              <text x="$(( LABEL_W + VALUE_W / 2 ))" y="13">$VALUE</text>
            </g>
          </svg>
          EOF
          cat > .github/coverage.json << EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "$VALUE",
            "color": "$COLOR"
          }
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badge-coverage.svg .github/coverage.json
          if git diff --cached --quiet; then
            echo "No badge changes to commit"
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
          retention-days: 7

  build-server:
    name: Build Server Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build server (release)
        run: cargo build --release -p apogee-server

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: apogee-server-linux
          path: target/release/apogee-server
          retention-days: 7
