[project]
name = "apogee-scripts"
version = "0.1.0"
description = "Python helpers for Apogee reference-data generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ryan Ennis" },
]
keywords = [
    "apogee",
    "space",
    "astrodynamics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
]

# Runtime dependencies for the project-local Python scripts under
# scripts/ (currently just generate_igrf_fixture.py). The Rust build
# itself has no Python dependency.
dependencies = [
    "pandas>=3.0.5",
    "ppigrf>=2.1.0",
]

[project.urls]
Repository = "https://github.com/LogOS-Development/apogee"

# No [build-system] table: this project has no importable Python
# package. The pyproject.toml is consumed directly by `uv` (via PEP
# 621 metadata) for `uv sync` and `uv pip install` to install the
# runtime dependencies declared above. Tooling like `pip` falls back
# to a metadata-only install.